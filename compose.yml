services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: sqlite:/app/data/bgm_rank.db
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      BGM_TOKEN: ${BGM_TOKEN}
      DEPLOY_HOOK_URL: ${DEPLOY_HOOK_URL}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./data:/app/data
